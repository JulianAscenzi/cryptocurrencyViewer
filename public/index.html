<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Crypto Viewer</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
  </head>
  <body>
    <header>
      <h1>Crypto Viewer</h1>
      <span id="last-updated">Sin datos todavía</span>
    </header>

    <div id="loading-indicator" role="status" aria-live="polite">Cargando datos...</div>
    <div id="error-banner" class="hidden" role="alert"></div>
    <div id="alert-banner" class="hidden" aria-live="polite"></div>

    <section class="table-wrapper">
      <table id="price-table">
        <thead>
          <tr>
            <th scope="col">Moneda</th>
            <th scope="col">Precio (USD)</th>
            <th scope="col">Cambio 24h</th>
            <th scope="col">Umbral de alerta (USD)</th>
            <th scope="col">Cantidad</th>
          </tr>
        </thead>
        <tbody id="price-table-body"></tbody>
      </table>
    </section>

    <section id="portfolio-summary" class="card">
      <h2>Mi portafolio</h2>
      <p id="portfolio-empty" class="muted">
        Agrega cantidades en la tabla para ver el valor de tu portafolio.
      </p>
      <dl class="hidden" id="portfolio-values">
        <div class="portfolio-row">
          <dt>Valor total</dt>
          <dd id="portfolio-value">—</dd>
        </div>
        <div class="portfolio-row">
          <dt>Cambio 24h ponderado</dt>
          <dd id="portfolio-change">—</dd>
        </div>
      </dl>
    </section>

    <section id="chart-controls">
      <label>
        Moneda
        <select id="chart-coin-select"></select>
      </label>
      <label>
        Rango
        <select id="chart-timeframe-select">
          <option value="1">1 día</option>
          <option value="7" selected>7 días</option>
          <option value="30">30 días</option>
          <option value="90">90 días</option>
          <option value="365">1 año</option>
        </select>
      </label>
    </section>

    <section>
      <canvas id="price-chart" height="100"></canvas>
    </section>

    <script src="app.js" type="module" defer></script>
  </body>
</html>
